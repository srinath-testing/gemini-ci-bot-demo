---
name: CI Failure Bot

on:
  workflow_run:
    workflows: ["QA Checks Only", "Unit Tests Only"]
    types:
      - completed

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  ci-failure-bot:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && !contains(github.event.workflow_run.actor.login, 'dependabot') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests PyGithub google-generativeai

      - name: Run CI Failure Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          set +e
          echo "Starting CI Failure Bot..."
          python ci_failure_bot.py
          echo "CI Failure Bot completed successfully"
