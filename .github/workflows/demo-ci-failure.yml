---
name: Demo CI Failure

on:
  pull_request:
    branches: [main]

jobs:
  python-import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Check imports
        run: |
          # This will fail for files with import errors
          python -c "import data_processor" || echo "Import check failed"
          python -c "import test_data_processor" || echo "Test import failed"
          python -m py_compile data_processor.py
          python -m py_compile test_data_processor.py

  python-qa-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install QA tools
        run: |
          pip install flake8 black isort
          
      - name: Run flake8
        run: |
          flake8 . --max-line-length=88 --extend-ignore=E203,W503
          
      - name: Run black check
        run: |
          black --check .
          
      - name: Run isort check
        run: |
          isort --check-only .

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install pytest
        run: |
          pip install pytest
          
      - name: Run tests
        run: |
          python -m pytest test_data_processor.py -v
