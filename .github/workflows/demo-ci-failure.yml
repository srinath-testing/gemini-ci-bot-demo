---
name: Demo CI Failure

on:
  pull_request:
    branches: [main]

jobs:
  python-qa-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install QA tools
        run: |
          pip install flake8 black isort
          
      - name: Run flake8
        run: |
          flake8 . --max-line-length=88 --extend-ignore=E203,W503
          
      - name: Run black check
        run: |
          black --check .
          
      - name: Run isort check
        run: |
          isort --check-only .

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          
      - name: Install pytest
        run: |
          pip install pytest
          
      - name: Run tests
        run: |
          python -m pytest test_math_utils.py -v || true
